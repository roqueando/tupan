name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest -q

  build:
    name: Build Nuitka executable
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1-mesa-glx
      - name: Install dependencies
        run: poetry install
      - name: Build with Nuitka
        run: |
          poetry run nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --output-dir=dist \
            --assume-yes-for-downloads \
            tupan/__main__.py
      - name: Rename binary
        run: |
          if [ "${{ runner.os }}" == "macOS" ]; then
            mv dist/__main__.bin dist/tupan-macos
          else
            mv dist/__main__.bin dist/tupan-linux
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tupan-${{ runner.os }}
          path: dist/tupan-*

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -la artifacts/*/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Tupan ${{ github.ref_name }}

            ### Downloads
            - **macOS**: `tupan-macos` (universal binary)
            - **Linux**: `tupan-linux` (x86_64)

            ### How to Use
            1. Download the binary for your OS
            2. Make it executable: `chmod +x tupan-*`
            3. Run it: `./tupan-*`
            4. No installation required

            ### What's New
            See the commit history for details.
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
