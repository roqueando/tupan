[tool.poetry]
name = "tupan"
version = "0.1.0"
description = "Interactive Power Electronics Workbench — Python Edition"
authors = []
readme = "README.md"
packages = [{include = "tupan"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
PySide6 = "^6.6"
numpy = "^1.24"
matplotlib = "^3.7"
schemdraw = "^0.23"
nuitka = "^2.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tupan/tests"]
