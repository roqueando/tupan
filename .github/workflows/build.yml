name: Build and Release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Run tests
        run: poetry run pytest -q

  build:
    name: Build Nuitka executable
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libxkbcommon-x11-0 libgl1 libegl1
      - name: Install dependencies
        run: poetry install
      - name: Build with Nuitka (macOS)
        if: runner.os == 'macOS'
        run: |
          poetry run nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --output-dir=dist \
            --macos-create-app-bundle \
            --macos-app-name=Tupan \
            --macos-app-version=${{ github.ref_name }} \
            tupan/
      - name: Build with Nuitka (Linux)
        if: runner.os == 'Linux'
        run: |
          poetry run nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --output-dir=dist \
            tupan/
      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: mv dist/tupan.bin dist/tupan-linux
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tupan-${{ runner.os }}
          path: |
            dist/tupan.app
            dist/tupan-linux

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: List artifacts
        run: ls -la artifacts/*/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## Tupan ${{ github.ref_name }}

            ### Downloads
            - **macOS**: `tupan.app` (double-click to run)
            - **Linux**: `tupan-linux` (standalone executable)

            ### How to Use
            **macOS**:
            1. Download `tupan.app`
            2. Double-click to open
            3. If macOS blocks it, right-click → Open

            **Linux**:
            1. Download `tupan-linux`
            2. `chmod +x tupan-linux && ./tupan-linux`

            ### What's New
            See the commit history for details.
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
